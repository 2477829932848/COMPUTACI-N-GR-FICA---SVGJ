<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estructura Layout</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <div class="logo">Logo</div>
        <div class="titulo">header</div>
        <div class="buscador">
            <input type="text" placeholder="Buscador">
        </div>
    </header>

    <!-- CONTENEDOR -->
    <div class="contenedor">
        <!-- Sidebar -->
        <aside class="sidebar">
            Side-bar
        </aside>

        <!-- Contenido principal -->
        <main class="content">
            content
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-text">Footer</div>
        <div class="footer-box">Footer-1</div>
        <div class="footer-box">Footer-2</div>
        <div class="footer-box">Footer-3</div>
    </footer>

</div>

</body>
</html>
